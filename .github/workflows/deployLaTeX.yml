name: Build and publish CV

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every variant of this CV must fit on exactly this many pages (empty = no check).
  MAX_PAGES: "1"

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [resume, resume-it, resume-signed, resume-it-signed]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Signed variants are compiled here only to check the layout: no signature
      # image is used and the PDFs are not published.
      - name: Compile ${{ matrix.variant }}.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.variant }}.tex
          work_in_root_file_dir: true
          args: -xelatex -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Check page count
        if: env.MAX_PAGES != ''
        run: |
          command -v pdfinfo >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) >/dev/null
          pages=$(pdfinfo "${{ matrix.variant }}.pdf" | awk '/^Pages:/ {print $2}')
          echo "${{ matrix.variant }}.pdf has $pages page(s)"
          if [ "$pages" -gt "$MAX_PAGES" ]; then
            echo "::error file=${{ matrix.variant }}.tex::${{ matrix.variant }}.pdf has $pages pages, the limit is $MAX_PAGES"
            exit 1
          fi

      - name: Upload PDF
        if: ${{ !contains(matrix.variant, 'signed') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}
          path: ${{ matrix.variant }}.pdf
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          path: _site/
          merge-multiple: true

      - name: Assemble site
        run: |
          cp -r site/. _site/
          updated=$(git log -1 --format=%cs)
          repo="${GITHUB_REPOSITORY#*/}"
          sed -i "s/__UPDATED__/$updated/g; s/__REPO__/$repo/g" _site/index.html
          (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) >/dev/null
          pdftoppm -png -scale-to-x 660 -scale-to-y -1 -f 1 -l 1 -singlefile _site/resume.pdf _site/preview-en
          pdftoppm -png -scale-to-x 660 -scale-to-y -1 -f 1 -l 1 -singlefile _site/resume-it.pdf _site/preview-it
          ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
